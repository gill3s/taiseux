[package]
name = "taiseux-core"
description = "Calcul des plus-values sur actifs numériques (art. 150 VH bis du CGI, formulaire 2086) et coffre chiffré"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[dev-dependencies]
